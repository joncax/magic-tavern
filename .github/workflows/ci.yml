name: CI

# Automatico em todo push para dev (para correr os testes livremente),
# e tambem como check obrigatorio em qualquer PR para dev ou main
# (incluindo a PR de promocao dev -> main, que e o "gate manual" real).
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  backend-tests:
    name: Backend - Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -v

  frontend-build:
    name: Frontend - Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy-dev:
    name: Build, Push & Deploy to Dev
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: joncax
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/magic-tavern-backend:${{ steps.tag.outputs.tag }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/magic-tavern-frontend:${{ steps.tag.outputs.tag }}

      # Bump automatico do values-dev.yaml - a Application de dev tem
      # auto-sync (prune+selfHeal), por isso isto reflete-se no cluster
      # em segundos, sem qualquer passo manual.
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: joncax/nerv-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Bump tags em values-dev.yaml
        working-directory: gitops
        run: |
          yq -i '.backend.image.tag = "${{ steps.tag.outputs.tag }}"' apps/magic-tavern/values-dev.yaml
          yq -i '.frontend.image.tag = "${{ steps.tag.outputs.tag }}"' apps/magic-tavern/values-dev.yaml

      - name: Commit & push
        working-directory: gitops
        run: |
          git config user.name "magic-tavern-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apps/magic-tavern/values-dev.yaml
          git commit -m "chore(magic-tavern): deploy dev @ ${{ steps.tag.outputs.tag }}"
          git push